name: Bug / Баг
description: Something does not work as it should / Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing! A screenshot of *What Windows sees* from the tray menu and the log (tray menu → *Open log*) help the most. Both show track titles; replace them if you'd rather not share.

        Спасибо, что пишешь! Больше всего помогают скриншот «Что видит Windows» из меню у часов и лог (меню у часов → «Открыть лог»). В них видны названия треков; если не хочешь их показывать, замени.
  - type: textarea
    id: what
    attributes:
      label: What happened / Что случилось
      description: What you did, what you expected, what you saw. / Что делал, что ожидал и что увидел.
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Player / Плеер
      description: Where the music plays. / Где играет музыка.
      placeholder: Yandex Music, Spotify, SoundCloud in Chrome, Telegram…
  - type: textarea
    id: check
    attributes:
      label: What Windows sees / Что видит Windows
      description: Tray menu → What Windows sees. A screenshot works too. / Меню у часов → «Что видит Windows». Можно скриншотом.
  - type: textarea
    id: log
    attributes:
      label: Log / Лог
      description: "Tray menu → Open log / Меню у часов → Открыть лог (%APPDATA%\\discord-nowcast\\log.txt)"
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version / Версия Windows
      placeholder: Windows 11 24H2
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot / Скриншот
      description: Drag a picture here if it helps. / Перетащи картинку, если так понятнее.
